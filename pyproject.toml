[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "expectbox-agents"
version = "0.2.0"
description = "Scoped email inboxes for agents: Expectbox Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Expectbox"}]
dependencies = []

[project.urls]
Homepage = "https://www.expectbox.com/"
Repository = "https://github.com/simon86pl/expectbox-sdk"
Issues = "https://github.com/simon86pl/expectbox-sdk/issues"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
expectbox_agents = ["py.typed", "*.pyi"]
